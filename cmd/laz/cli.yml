http:
  desc: Expose a local HTTP service on a public subdomain
  color: green
  native: true
  args:
  - port:int
  - subdomain|s:str?
  - host|H:str=127.0.0.1
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - name|n:str?
  - encrypt|e:bool=false
  - compress|c:bool=false
  - bandwidth|B:str?
  - render:bool=false

https:
  desc: Expose a local HTTPS service (needs vhostHTTPSPort on frps)
  color: green
  native: true
  args:
  - port:int
  - subdomain|s:str?
  - host|H:str=127.0.0.1
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - name|n:str?
  - encrypt|e:bool=false
  - compress|c:bool=false
  - bandwidth|B:str?
  - render:bool=false

tcp:
  desc: Expose local TCP port(s) on remote port(s); ranges ok (8000-8010)
  color: green
  native: true
  args:
  - port:str
  - remote|r:str?
  - host|H:str=127.0.0.1
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - name|n:str?
  - encrypt|e:bool=false
  - compress|c:bool=false
  - bandwidth|B:str?
  - render:bool=false

udp:
  desc: Expose local UDP port(s) on remote port(s); ranges ok
  color: green
  native: true
  args:
  - port:str
  - remote|r:str?
  - host|H:str=127.0.0.1
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - name|n:str?
  - encrypt|e:bool=false
  - compress|c:bool=false
  - bandwidth|B:str?
  - render:bool=false

share:
  desc: Open a private tunnel reachable only via matching 'laz visit'
  color: green
  native: true
  args:
  - port:int
  - type|y:str=tcp
  - key|k:str?
  - name|n:str?
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - encrypt|e:bool=false
  - compress|c:bool=false
  - bandwidth|B:str?
  - render:bool=false

visit:
  desc: Connect to a private share (peer of 'laz share')
  color: green
  native: true
  args:
  - name:str
  - key|k:str
  - type|y:str=stcp
  - bind|b:str?
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - render:bool=false

xtcp:
  desc: Open a P2P tunnel (NAT hole-punching, no relay traffic)
  color: green
  native: true
  args:
  - port:int
  - key|k:str?
  - name|n:str?
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - render:bool=false

dir:
  desc: Serve a local directory over HTTPS on a subdomain
  color: green
  native: true
  args:
  - path:str
  - subdomain|s:str?
  - user|u:str?
  - pass|P:str?
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - render:bool=false

socks:
  desc: Run a SOCKS5 proxy on a remote port into this network
  color: green
  native: true
  args:
  - remote|r:int?
  - user|u:str?
  - pass|P:str?
  - ttl|t:str?
  - server|S:str?
  - transport|p:str?
  - token|T:str?
  - render:bool=false

frpc:
  desc: Download or update the pinned frpc binary
  color: white
  native: true
  args:
  - version|v:str?

version:
  desc: Show version
  color: white
  native: true

completion:
  desc: Print shell completion script (bash, zsh, fish)
  color: white
  native: true
  args:
  - shell:str

update:
  desc: Update laz to the latest GitHub release
  color: white
  native: true
  args:
  - check|c:bool=false
