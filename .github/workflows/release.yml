name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Cross-build
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}"
          for t in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            GOOS="${t%-*}" GOARCH="${t#*-}" CGO_ENABLED=0 go build -trimpath \
              -ldflags="$LDFLAGS" -o "dist/laz-$t" ./cmd/laz
          done
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/laz-*
